<linkset>
  <html:link rel="localization" href="anytero.ftl" />
</linkset>

<!-- `Anytero_Preferences` is defined in `src/content/prefs/preferences.tsx` -->
<groupbox class="anytero-groupbox" onload="Anytero_Preferences.init()">
  <label>
    <html:h2 data-l10n-id="anytero-preferences-anytype-groupbox-heading" />
  </label>
  <hbox>
    <button
      class="anytero-margin-block-end"
      data-l10n-id="anytero-preferences-anytype-connect-button"
      hidden="true"
      id="anytero-anytypeConnect"
    />
  </hbox>
  <image class="zotero-spinner-16" id="anytero-anytypeConnection-spinner" />
  <vbox
    align="start"
    class="anytero-margin-block-end"
    hidden="true"
    id="anytero-anytypeAuth-container"
  >
    <label data-l10n-id="anytero-preferences-anytype-auth-instructions" />
    <hbox align="center" class="anytero-margin-block-start">
      <label
        control="anytero-anytypeCode"
        data-l10n-id="anytero-preferences-anytype-code-label"
      />
      <html:input
        data-l10n-id="anytero-preferences-anytype-code-input"
        id="anytero-anytypeCode"
        type="text"
        maxlength="4"
        style="width: 100px"
      />
      <button label="Verify" id="anytero-anytypeVerify" />
    </hbox>
  </vbox>
  <vbox align="start" hidden="true" id="anytero-anytypeConnection-container">
    <hbox align="center">
      <label
        data-l10n-id="anytero-preferences-anytype-connected"
        id="anytero-anytypeStatus"
      />
      <button
        data-l10n-id="anytero-preferences-anytype-disconnect-button"
        id="anytero-anytypeDisconnect"
      />
    </hbox>
    <hbox align="center" class="anytero-margin-block-start">
      <label
        control="anytero-anytypeSpace"
        data-l10n-id="anytero-preferences-anytype-space"
      />
      <menulist
        id="anytero-anytypeSpace"
        disabled="true"
        native="true"
        preference="extensions.anytero.anytypeSpaceId"
      >
        <menupopup />
      </menulist>
    </hbox>
    <hbox align="center" class="anytero-margin-block-start">
      <label
        control="anytero-anytypeType"
        data-l10n-id="anytero-preferences-anytype-type"
      />
      <menulist
        id="anytero-anytypeType"
        disabled="true"
        native="true"
        preference="extensions.anytero.anytypeTypeKey"
      >
        <menupopup />
      </menulist>
    </hbox>
  </vbox>
  <label class="anytero-error" hidden="true" id="anytero-anytypeError" />
</groupbox>

<groupbox class="anytero-groupbox">
  <label>
    <html:h2 data-l10n-id="anytero-preferences-properties-groupbox-heading" />
  </label>
  <label data-l10n-id="anytero-preferences-properties-groupbox-description" />
  <hbox align="center" class="anytero-margin-block-start">
    <label
      control="anytero-pageTitleFormat"
      data-l10n-id="anytero-preferences-page-title-format"
    />
    <menulist
      id="anytero-pageTitleFormat"
      disabled="true"
      native="true"
      preference="extensions.anytero.pageTitleFormat"
    >
      <menupopup />
    </menulist>
  </hbox>
</groupbox>

<groupbox class="anytero-groupbox">
  <label>
    <html:h2 data-l10n-id="anytero-preferences-sync-groupbox-heading" />
  </label>
  <label data-l10n-id="anytero-preferences-sync-groupbox-description1" />
  <label data-l10n-id="anytero-preferences-sync-groupbox-description2" />
  <hbox
    class="anytero-margin-block-start anytero-margin-block-end virtualized-table-container"
    flex="1"
  >
    <html:div id="anytero-syncConfigsTable-container" />
  </hbox>
  <checkbox
    data-l10n-id="anytero-preferences-sync-on-modify-items"
    id="anytero-syncOnModifyItems"
    native="true"
    preference="extensions.anytero.syncOnModifyItems"
  />
  <checkbox
    data-l10n-id="anytero-preferences-sync-notes"
    id="anytero-syncNotes"
    native="true"
    preference="extensions.anytero.syncNotes"
  />
  <checkbox
    data-l10n-id="anytero-preferences-sync-reading-list-status"
    id="anytero-syncReadingListStatus"
    native="true"
    preference="extensions.anytero.syncReadingListStatus"
  />
</groupbox>
